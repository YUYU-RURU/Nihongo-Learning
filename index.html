:root{
  --paper:#F6F3EE; --grid:#E4DED5; --ink:#4B4744; --muted:#7C7570; --white:#FCFAF6;
  --coral:#D8B4AE; --yellow:#CFDBC8; --water:#B3C3CD; --green:#B7C4AE;
  --rose-deep:#A8736D; --blue-deep:#647D8E;
  --bd:2px solid var(--ink); --r:10px;
  --jp:"LXGW WenKai TC","Klee One","Zen Kurenaido","BiauKai","DFKai-SB","Kaiti TC",cursive,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--jp);font-size:17px;line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
b{font-weight:400}
header{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:var(--bd)}
.bar{max-width:1080px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:flex-end;gap:10px 22px;flex-wrap:wrap}
.brand{font-size:26px;letter-spacing:.04em;padding-bottom:10px}
.brand span{margin-left:4px;padding:0 6px;background:linear-gradient(transparent 55%,var(--coral) 55%)}
nav{display:flex;gap:6px;flex:1;min-width:280px;align-items:flex-end}
nav button{flex:1;border:var(--bd);border-bottom:0;background:var(--white);border-radius:12px 12px 0 0;padding:4px 6px 5px;white-space:nowrap;color:var(--muted)}
nav button[aria-selected=true]{color:var(--ink);padding:9px 6px 9px}
nav button[data-tab=kana][aria-selected=true]{background:var(--coral)}
nav button[data-tab=vocab][aria-selected=true]{background:var(--yellow)}
nav button[data-tab=yt][aria-selected=true]{background:var(--water)}
main{max-width:1080px;margin:0 auto;padding:24px 16px 80px}
section[hidden]{display:none}
h2{display:inline-block;font-size:21px;font-weight:400;margin:30px 0 12px;padding:0 8px;letter-spacing:.1em;background:linear-gradient(transparent 55%,var(--yellow) 55%)}
h2:first-child{margin-top:4px}
#tab-kana>h2{background:linear-gradient(transparent 55%,var(--coral) 55%)}
.cols>div:first-child h2{background:linear-gradient(transparent 55%,var(--water) 55%)}
.cols>div:last-child h2{background:linear-gradient(transparent 55%,var(--green) 55%)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;border:var(--bd);border-radius:8px;overflow:hidden;background:var(--white)}
.seg button{border:0;background:none;padding:5px 15px}
.seg button+button{border-left:var(--bd)}
.seg button.on{background:var(--yellow)}
.chip{border:var(--bd);background:var(--white);border-radius:8px;padding:3px 12px;white-space:nowrap}
.chip.on{background:var(--yellow)}
.hint{font-size:15px;color:var(--muted)}
.warn{background:var(--yellow);border:var(--bd);border-radius:var(--r);padding:8px 14px;margin-bottom:16px}

/* 50 音 */
.kgrid{display:grid;gap:10px}
.kgrid.c5{grid-template-columns:repeat(5,1fr)}
.kgrid.c3{grid-template-columns:repeat(3,1fr)}
.k{background:var(--white);border:var(--bd);border-radius:var(--r);padding:6px 0;text-align:center;box-shadow:3px 3px 0 var(--grid);transition:transform .08s,background .15s}
.k:active,.k.hit{transform:translate(2px,2px);box-shadow:none}
.k.hit{background:var(--coral)}
#k-daku .k.hit{background:var(--water)}
#k-yo .k.hit{background:var(--green)}
.k b{color:var(--blue-deep);display:block;font-size:clamp(28px,6.4vw,40px);line-height:1.2}
.k small{display:block;font-size:15px;color:var(--muted)}
.k i{display:block;font-style:normal;font-size:15px;color:var(--muted)}
.k em{display:flex;justify-content:center;align-items:center;gap:3px;font-style:normal;font-size:16px;line-height:1;height:30px;margin-top:2px}
.k em u{text-decoration:none;color:var(--muted);font-size:12px}
.k em .cao{font-family:'KanaCao',cursive;font-size:27px;color:var(--rose-deep)}
.k small span{color:var(--blue-deep);margin-left:2px}
.k.blank{visibility:hidden}
.cols{display:grid;gap:0 32px}
@media(min-width:820px){.cols{grid-template-columns:1fr 1fr}}
#stopBtn{position:fixed;right:18px;bottom:18px;z-index:20;border:var(--bd);background:var(--coral);border-radius:var(--r);padding:8px 18px;font-size:19px;box-shadow:3px 3px 0 var(--ink)}
#stopBtn:active{transform:translate(3px,3px);box-shadow:none}
#stopBtn[hidden]{display:none}

/* 單字 */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
@media(min-width:700px){.chips{flex-wrap:wrap;overflow:visible}}
#q{flex:1;min-width:160px;border:0;border-bottom:var(--bd);background:transparent;border-radius:0;padding:6px 6px;outline:0}
#q:focus{background:var(--yellow)}
.urlrow input:focus,.manual textarea:focus{box-shadow:0 0 0 3px var(--yellow)}
.words{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.w{background:var(--white);border:var(--bd);border-radius:var(--r);padding:12px 16px;box-shadow:3px 3px 0 var(--grid)}
.w-top{display:flex;align-items:center;gap:12px}
.w-word{font-size:30px;line-height:1.25}
.w-kana{font-size:15px;color:var(--muted);min-height:22px}
.w-zh{color:var(--muted)}
.w-cat{margin-left:auto;font-size:14px;padding:0 6px;white-space:nowrap;align-self:flex-start;background:linear-gradient(transparent 45%,var(--green) 45%)}
.w-ex{margin-top:10px;padding-top:10px;border-top:2px dashed var(--muted);display:flex;gap:10px;align-items:flex-start}
.w-ex p{margin:0}
.ex-ja{font-size:20px;line-height:2}
.ex-zh{font-size:15px;color:var(--muted)}
rt{font-size:.55em;color:var(--muted)}
.play{flex:none;width:40px;height:40px;border-radius:50%;border:var(--bd);background:var(--coral);font-size:13px;display:grid;place-items:center;padding:0 0 0 2px;font-family:sans-serif}
.play.sm{width:32px;height:32px;font-size:11px;background:var(--water);margin-top:5px}
.play:active{background:var(--yellow)}

/* YouTube */
.urlrow{display:flex;gap:10px;margin-bottom:16px}
.urlrow input{flex:1;min-width:0;border:var(--bd);background:var(--white);border-radius:var(--r);padding:8px 14px;outline:0}
.btn{border:var(--bd);background:var(--coral);border-radius:var(--r);padding:6px 18px;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.ghost{background:var(--white);padding:4px 11px;box-shadow:none}
.btn.ghost:active{transform:none;background:var(--yellow)}
.btn.ghost.on{background:var(--yellow)}
#showJa.on{background:var(--coral)}
#showZh.on{background:var(--water)}
#loop.on{background:var(--green)}
.yt{display:grid;gap:18px}
@media(min-width:900px){.yt{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}}
.frame{position:relative;aspect-ratio:16/9;background:var(--white);border:var(--bd);border-radius:var(--r);overflow:hidden}
.frame>*{position:absolute;inset:0;width:100%;height:100%}
.frame .empty{display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.frame .empty[hidden]{display:none}
.sub{background:var(--white);border:var(--bd);border-radius:var(--r);margin-top:12px;padding:12px 18px;min-height:116px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;box-shadow:3px 3px 0 var(--grid)}
.sub .ja{font-size:clamp(22px,3.6vw,30px);line-height:1.4}
.sub .zh{font-size:clamp(17px,2.8vw,21px);line-height:1.4;padding:0 8px;background:linear-gradient(transparent 55%,var(--water) 55%)}
.sub .zh:empty{display:none}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ctrl .lbl{font-size:15px;color:var(--muted)}
.ctrl .sp{flex:1}
#rates{display:inline-flex;gap:6px;flex-wrap:wrap}
#status{margin:12px 0 0;color:var(--muted)}
#status.err{color:var(--ink);background:var(--coral);border:var(--bd);border-radius:var(--r);padding:6px 12px}
#status:empty{display:none}
.list{background:var(--white);border:var(--bd);border-radius:var(--r);max-height:66vh;overflow-y:auto}
.list:empty::after{content:"字幕載入後會顯示在這裡，點任一句可跳到該處。";display:block;padding:20px;color:var(--muted)}
.row{display:grid;grid-template-columns:46px 1fr;gap:8px;padding:8px 14px;border-bottom:1px solid var(--grid);cursor:pointer}
.row:last-child{border-bottom:0}
.row time{font-size:14px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.row .ja{font-size:19px}
.row .zh{font-size:15px;color:var(--muted)}
.row.on{background:var(--yellow)}
.row.on .zh{color:var(--ink)}
details{margin-top:18px;background:var(--white);border:var(--bd);border-radius:var(--r);padding:10px 16px}
summary{cursor:pointer}
.manual{display:grid;gap:12px;margin-top:10px}
@media(min-width:640px){.manual{grid-template-columns:1fr 1fr}}
.manual textarea{width:100%;height:120px;border:var(--bd);border-radius:8px;padding:8px;background:var(--paper);font-size:14px;font-family:ui-monospace,monospace;outline:0}
.manual label{display:block;margin-bottom:4px}
.manual input[type=file]{font-size:14px;margin-top:6px;max-width:100%}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">にほんご<span>練習帳</span></div>
    <nav role="tablist">
      <button role="tab" data-tab="kana" aria-selected="true">50 音</button>
      <button role="tab" data-tab="vocab" aria-selected="false">N5 單字</button>
      <button role="tab" data-tab="yt" aria-selected="false">YouTube 字幕</button>
    </nav>
  </div>
</header>

<main>
<div class="warn" id="voiceWarn" hidden>這台裝置找不到日文語音，發音可能無法播放。請在系統設定安裝日文語音，或改用 Chrome／Edge／Safari。</div>

<!-- ============ 分頁 1：50 音 ============ -->
<section id="tab-kana">
  <div class="tools">
    <div class="seg" id="kanaMode">
      <button data-m="h" class="on">平假名</button>
      <button data-m="k">片假名</button>
      <button data-m="b">兩者</button>
    </div>
    <span class="hint">點任一個假名聽發音；清音下方是字源：漢字 → 草書 → 假名</span>
  </div>
  <h2>清音</h2><div class="kgrid c5" id="k-sei"></div>
  <div class="cols">
    <div><h2>濁音・半濁音</h2><div class="kgrid c5" id="k-daku"></div></div>
    <div><h2>拗音</h2><div class="kgrid c3" id="k-yo"></div></div>
  </div>
</section>

<!-- ============ 分頁 2：N5 單字 ============ -->
<section id="tab-vocab" hidden>
  <div class="tools">
    <input id="q" type="search" placeholder="搜尋單字、假名或中文…">
    <div class="seg" id="ttsRate">
      <button data-r="0.7">慢速</button>
      <button data-r="1" class="on">正常</button>
    </div>
    <span class="hint" id="count"></span>
  </div>
  <div class="chips" id="cats"></div>
  <div class="words" id="words"></div>
</section>

<!-- ============ 分頁 3：YouTube ============ -->
<section id="tab-yt" hidden>
  <div class="urlrow">
    <input id="url" type="url" inputmode="url" placeholder="貼上 YouTube 影片連結，例如 https://www.youtube.com/watch?v=…">
    <button class="btn" id="load">載入</button>
  </div>
  <div class="yt">
    <div>
      <div class="frame"><div class="empty" id="playerEmpty">貼上連結後按「載入」</div><div id="player"></div></div>
      <div class="sub"><div class="ja" id="subJa"></div><div class="zh" id="subZh"></div></div>
      <div class="ctrl">
        <span class="lbl">速度</span>
        <span id="rates"></span>
      </div>
      <div class="ctrl">
        <button class="btn ghost" id="prev" title="上一句">⏮ 上一句</button>
        <button class="btn ghost" id="again" title="重聽這句">↻ 重聽</button>
        <button class="btn ghost" id="next" title="下一句">下一句 ⏭</button>
      </div>
      <div class="ctrl">

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* ---------- 分頁切換 ---------- */
function showTab(name){
  $$('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===name));
  ['kana','vocab','yt'].forEach(t=>$('#tab-'+t).hidden=t!==name);
  try{history.replaceState(null,'','#'+name)}catch(e){}
  if('speechSynthesis' in window)speechSynthesis.cancel();
}
$$('nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
if(['kana','vocab','yt'].includes(location.hash.slice(1)))showTab(location.hash.slice(1));

/* ---------- 日文語音 ---------- */
let jaVoice=null, ttsRate=1;
const hasTTS='speechSynthesis' in window;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  jaVoice=vs.find(v=>/^ja/i.test(v.lang)&&/Google|Kyoko|O-ren|Nanami|Haruka|Siri/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null;
  $('#voiceWarn').hidden=!(vs.length&&!jaVoice);
}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}else $('#voiceWarn').hidden=false;
function speak(text,rate){
  if(!hasTTS)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; if(jaVoice)u.voice=jaVoice; u.rate=rate||1;
  speechSynthesis.speak(u);
}

function stopSpeak(){ if(hasTTS)speechSynthesis.cancel(); $('#stopBtn').hidden=true; }
$('#stopBtn').onclick=stopSpeak;
if(hasTTS)setInterval(()=>{$('#stopBtn').hidden=!(speechSynthesis.speaking||speechSynthesis.pending);},200);

// 字源：平假名來自漢字草書，片假名取自漢字的一部分
const ORIGIN_H="あ安い以う宇え衣お於か加き幾く久け計こ己さ左し之す寸せ世そ曽た太ち知つ川て天と止な奈に仁ぬ奴ね祢の乃は波ひ比ふ不へ部ほ保ま末み美む武め女も毛や也ゆ由よ与ら良り利る留れ礼ろ呂わ和を遠ん无";
const ORIGIN_K="あ阿い伊う宇え江お於か加き幾く久け介こ己さ散し之す須せ世そ曽た多ち千つ川て天と止な奈に仁ぬ奴ね祢の乃は八ひ比ふ不へ部ほ保ま末み三む牟め女も毛や也ゆ由よ與ら良り利る流れ礼ろ呂わ和を乎ん尓";
const CAO_MAP={'計':'计','曽':'曾','呂':'吕'}, CAO_SKIP='幾遠';   // 草書字型缺字時的替代／略過
const originOf=(str,h)=>{const i=str.indexOf(h); return i<0||i%2?'':str[i+1];};
const toKata=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
let kanaMode='h';
function renderKana(){
  for(const g of ['sei','daku','yo']){
    $('#k-'+g).innerHTML=KANA[g].map(x=>{
      if(x==='-')return '<div class="k blank"></div>';
      const [h,r]=x.split(' '), k=toKata(h);
      const main=kanaMode==='k'?k:h;
      let sub=kanaMode==='b'?`<small>${k}</small>`:'', org='';
      if(g==='sei'){
        const oh=originOf(ORIGIN_H,h), ok=originOf(ORIGIN_K,h);
        // 平假名：漢字 → 草書；片假名取自漢字的一部分，沒有草書階段
        const c=CAO_SKIP.includes(oh)?'':(CAO_MAP[oh]||oh);
        const chain=`<em title="字源">${oh}${c?`<u>→</u><span class="cao">${c}</span>`:''}</em>`;
        if(kanaMode==='h')org=chain;
        else if(kanaMode==='k')org=`<em title="字源">${ok}</em>`;
        else{sub=`<small>${k}<span>←${ok}</span></small>`;org=chain;}
      }
      return `<button class="k" data-say="${h}"><b>${main}</b>${sub}<i>${r}</i>${org}</button>`;
    }).join('');
  }
}
$('#kanaMode').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  kanaMode=b.dataset.m; $$('#kanaMode button').forEach(x=>x.classList.toggle('on',x===b)); renderKana();
};
$('#tab-kana').addEventListener('click',e=>{
  const b=e.target.closest('.k[data-say]'); if(!b)return;
  speak(b.dataset.say,0.8);
  b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),450);
});
renderKana();

const RUBY=/([一-龯々ヶ]+)\[([^\]]+)\]/g;
const ruby=s=>s.replace(RUBY,'<ruby>$1<rt>$2</rt></ruby>');
const plain=s=>s.replace(/\[[^\]]*\]/g,'');
const CATS=Object.keys(VOCAB);
let curCat='全部';
function renderCats(){
  $('#cats').innerHTML=['全部',...CATS].map(c=>`<button class="chip${c===curCat?' on':''}" data-c="${c}">${c}</button>`).join('');
}
function renderWords(){
  const q=$('#q').value.trim().toLowerCase(); let n=0, html='';
  for(const c of CATS){
    if(curCat!=='全部'&&c!==curCat)continue;
    for(const [w,k,zh,ex,exZh] of VOCAB[c]){
      if(q&&!(w+k+zh+plain(ex)+exZh).toLowerCase().includes(q))continue;
      n++;
      html+=`<article class="w">
        <div class="w-top"><button class="play" data-say="${k||w}" aria-label="播放單字">▶</button>
          <div><div class="w-kana">${k}</div><div class="w-word">${w}</div><div class="w-zh">${zh}</div></div>
          <span class="w-cat">${c}</span></div>
        <div class="w-ex"><button class="play sm" data-say="${plain(ex)}" aria-label="播放例句">▶</button>
          <div><p class="ex-ja">${ruby(ex)}</p><p class="ex-zh">${exZh}</p></div></div>
      </article>`;
    }
  }
  $('#words').innerHTML=html||'<p class="hint">找不到符合的單字。</p>';
  $('#count').textContent=n+' 個單字';
}

const SUBS_API='/.netlify/functions/subs';
let player=null, cues={ja:[],zh:[]}, offset=0, loopOn=false, loopIdx=-1, activeIdx=-2, rate=1;
const RATES=[0.5,0.75,1,1.25,1.5];
$('#rates').innerHTML=RATES.map(r=>`<button class="btn ghost${r===1?' on':''}" data-r="${r}">${r}×</button>`).join(' ');
$('#rates').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return; rate=+b.dataset.r;
  $$('#rates button').forEach(x=>x.classList.toggle('on',x===b));
  if(player&&player.setPlaybackRate)player.setPlaybackRate(rate);
};
function parseId(s){
  s=s.trim(); if(/^[\w-]{11}$/.test(s))return s;
  const m=s.match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
  return m?m[1]:null;
}
function setStatus(t,err){const el=$('#status'); el.textContent=t; el.classList.toggle('err',!!err);}
function loadYT(){
  return new Promise(res=>{
    if(window.YT&&YT.Player)return res();
    window.onYouTubeIframeAPIReady=res;
    const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  });
}
const ON_WEB=/^https?:$/.test(location.protocol);
const YT_ERR={2:'影片連結或 ID 不正確',5:'這部影片無法在網頁播放器播放',100:'找不到影片（可能已刪除或設為私人）',
  101:'影片擁有者不允許在其他網站嵌入播放',150:'影片擁有者不允許在其他網站嵌入播放',
  153:'YouTube 拒絕播放：這個頁面不是從網站網址開啟的（請部署到 Netlify 後再用網址開啟）'};
let videoMsg='', subMsg='', subErr=false;
function showMsg(){ setStatus([videoMsg,subMsg].filter(Boolean).join('　｜　'),!!videoMsg||subErr); }
function showPlayerMsg(t){ const e=$('#playerEmpty'); e.textContent=t; e.hidden=false; }
async function loadVideo(){
  const id=parseId($('#url').value);
  if(!id){videoMsg='看不懂這個連結，請貼上完整的 YouTube 影片網址。';subMsg='';showMsg();return;}
  videoMsg=''; subMsg=''; subErr=false; setCues([],[]);
  if(!ON_WEB){
    videoMsg='目前是直接開啟檔案或在預覽視窗中，YouTube 不允許這樣播放。請把網頁部署到 Netlify，再用 https 網址開啟。';
    showPlayerMsg('需要部署到 Netlify 後才能播放影片'); showMsg(); return;
  }
  $('#playerEmpty').hidden=true;
  fetchSubs(id);
  const timer=setTimeout(()=>{ if(!(window.YT&&YT.Player)){videoMsg='YouTube 播放器載入不了，可能是網路或公司／院內防火牆擋住 youtube.com。';showMsg();} },8000);
  await loadYT(); clearTimeout(timer); videoMsg=''; showMsg();
  if(player&&player.loadVideoById){player.loadVideoById(id);}
  else player=new YT.Player('player',{videoId:id,playerVars:{playsinline:1,rel:0,origin:location.origin},
    events:{onReady:()=>player.setPlaybackRate(rate),
      onError:e=>{videoMsg='影片無法播放：'+(YT_ERR[e.data]||('YouTube 錯誤代碼 '+e.data));showMsg();},
      onPlaybackRateChange:e=>{rate=e.data;$$('#rates button').forEach(x=>x.classList.toggle('on',+x.dataset.r===rate));}}});
}
async function fetchSubs(id){
  subErr=false; subMsg='正在抓取字幕…'; showMsg();
  try{
    const r=await fetch(SUBS_API+'?v='+id);
    const j=await r.json().catch(()=>({error:r.status===404?'網站上沒有字幕程式（用拖曳上傳部署時不會包含它，需改用 GitHub 或 CLI 部署）':'字幕服務沒有回應（HTTP '+r.status+'）'}));
    if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));
    setCues(j.ja||[],j.zh||[]);
    if(!cues.ja.length&&!cues.zh.length)throw new Error('這部影片沒有可用的字幕');
    subMsg=`字幕已載入：日文 ${cues.ja.length} 句${j.jaNote?'（'+j.jaNote+'）':''}、中文 ${cues.zh.length} 句${j.zhNote?'（'+j.zhNote+'）':''}`; showMsg();
  }catch(e){
    subErr=true; subMsg='自動抓字幕失敗：'+e.message+'。影片仍可播放與調速；可用下方「手動貼上字幕」。'; showMsg();
    $('#manualBox').open=true;
  }
}
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function findCue(arr,t){            // 回傳 t 所在或之前最近一句的 index
  let lo=0,hi=arr.length-1,ans=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(arr[m].s<=t){ans=m;lo=m+1}else hi=m-1}
  return ans;
}
const mainCues=()=>cues.ja.length?cues.ja:cues.zh;
function setCues(ja,zh){
  cues={ja,zh}; activeIdx=-2; loopIdx=-1;
  const list=$('#list'); list.textContent='';
  const main=mainCues(), isJa=main===cues.ja;
  main.forEach((c,i)=>{
    const row=document.createElement('div'); row.className='row'; row.dataset.i=i;
    const tm=document.createElement('time'); tm.textContent=fmt(c.s);
    const box=document.createElement('div');
    const a=document.createElement('div'); a.className=isJa?'ja':'zh'; a.textContent=c.t; box.appendChild(a);
    if(isJa&&cues.zh.length){
      const k=findCue(cues.zh,(c.s+c.e)/2);
      if(k>=0&&cues.zh[k].e>c.s){const b=document.createElement('div'); b.className='zh'; b.textContent=cues.zh[k].t; box.appendChild(b);}
    }
    row.append(tm,box); list.appendChild(row);
  });
  $('#subJa').textContent=''; $('#subZh').textContent='';
}
function seekTo(i){
  const m=mainCues(); if(!player||!player.seekTo||!m.length)return;
  i=Math.max(0,Math.min(m.length-1,i));
  if(loopOn)loopIdx=i;
  player.seekTo(Math.max(0,m[i].s-offset+0.01),true); player.playVideo();
}
function tick(){
  if(!player||!player.getCurrentTime)return;
  const t=player.getCurrentTime()+offset, m=mainCues();
  const at=(arr)=>{const i=findCue(arr,t); return i>=0&&t<arr[i].e?arr[i].t:'';};
  $('#subJa').textContent=at(cues.ja); $('#subZh').textContent=at(cues.zh);
  if(!m.length)return;
  if(loopOn&&loopIdx>=0&&m[loopIdx]&&(t>=m[loopIdx].e-0.05||t<m[loopIdx].s-0.5)&&player.getPlayerState()===1){
    player.seekTo(Math.max(0,m[loopIdx].s-offset+0.01),true); return;
  }
  const i=findCue(m,t);
  if(i!==activeIdx){
    activeIdx=i;
    const old=$('#list .row.on'); if(old)old.classList.remove('on');
    const row=$('#list').children[i];
    if(row){row.classList.add('on'); const L=$('#list'); L.scrollTo({top:row.offsetTop-L.offsetTop-L.clientHeight/3,behavior:'smooth'});}
  }
}
setInterval(tick,120);

$('#list').onclick=e=>{const r=e.target.closest('.row'); if(r)seekTo(+r.dataset.i);};
$('#prev').onclick=()=>seekTo(Math.max(0,activeIdx)-1);
$('#again').onclick=()=>seekTo(Math.max(0,activeIdx));
$('#next').onclick=()=>seekTo(activeIdx+1);
$('#loop').onclick=e=>{loopOn=!loopOn; loopIdx=loopOn?Math.max(0,activeIdx):-1; e.currentTarget.classList.toggle('on',loopOn);};
$('#showJa').onclick=e=>{$('#subJa').hidden=!e.currentTarget.classList.toggle('on');};
$('#showZh').onclick=e=>{$('#subZh').hidden=!e.currentTarget.classList.toggle('on');};
function setOffset(d){offset=Math.round((offset+d)*10)/10; $('#offV').textContent=(offset>0?'+':'')+offset.toFixed(1)+'s';}
$('#offM').onclick=()=>setOffset(-0.2); $('#offP').onclick=()=>setOffset(0.2);

/* 手動字幕（SRT / VTT） */
function parseSub(txt){
  const out=[], re=/(?:(\d+):)?(\d+):(\d+)[.,](\d+)\s*-->\s*(?:(\d+):)?(\d+):(\d+)[.,](\d+)/;
  const sec=(h,m,s,ms)=>(+(h||0))*3600+(+m)*60+(+s)+parseFloat('0.'+ms);
  for(const b of txt.replace(/\r/g,'').split(/\n\s*\n/)){
    const lines=b.split('\n'), i=lines.findIndex(l=>re.test(l)); if(i<0)continue;
    const m=lines[i].match(re), t=lines.slice(i+1).join(' ').replace(/<[^>]+>/g,'').trim();
    if(t)out.push({s:sec(m[1],m[2],m[3],m[4]),e:sec(m[5],m[6],m[7],m[8]),t});
  }
  return out.sort((a,b)=>a.s-b.s);
}
for(const [f,t] of [['#fJa','#mJa'],['#fZh','#mZh']])
  $(f).onchange=async e=>{const file=e.target.files[0]; if(file)$(t).value=await file.text();};
$('#applyManual').onclick=()=>{
  const ja=parseSub($('#mJa').value), zh=parseSub($('#mZh').value);
  if(!ja.length&&!zh.length){setStatus('讀不到字幕內容，請確認是 SRT 或 VTT 格式（含 00:00:01,000 --> 00:00:03,000 這種時間列）。',true);return;}
  setCues(ja,zh); subErr=false; subMsg=`已套用手動字幕：日文 ${ja.length} 句、中文 ${zh.length} 句`; showMsg();
};
</script>
